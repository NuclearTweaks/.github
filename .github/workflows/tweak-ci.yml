# tweak-ci.yml — NuclearTweaks org-shared CI (reusable workflow)
#
# Called by every tweak repo (build.yml):
#   uses: NuclearTweaks/.github/.github/workflows/tweak-ci.yml@main + secrets: inherit
#
# push main          → build rootless device deb → open/update release PR (version bump)
# merged release/*   → the merge commit on main triggers: rebuild → tag vX.Y.Z →
#                      GitHub Release w/ deb → dispatch APT repo rebuild
#
# NOTE: GitHub does NOT reliably run `pull_request: closed` workflows once the
# head branch is deleted at merge time — so publishing keys off the merge COMMIT
# on main (commits→pulls API), not the PR event. A cheap ubuntu gate job decides
# whether the (10x-billed) macOS publish runner is needed at all.
#
# Simulator is NOT built here (by design): sim testing is local-only via
# tools/sim-test.sh against the jailbroken JB-13mini. Actions = real-device debs only.

name: tweak-ci

on:
  workflow_call:
    secrets:
      NUCLEAR_BOT_TOKEN:
        description: >-
          PAT with repo scope. Authors release PRs (org policy blocks
          Actions-authored PRs) and repository_dispatches the APT repo. Set on
          each tweak repo by new-tweak.sh.
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  ORG: NuclearTweaks
  APT_REPO: NuclearTweaks.github.io

jobs:
  release-gate:
    name: is HEAD a release merge?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{steps.check.outputs.publish }}
      version: ${{steps.check.outputs.version }}
    steps:
      - name: Check HEAD commit provenance
        id: check
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          head_pr_ref="$(gh api "repos/${{github.repository }}/commits/${{github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.ref // ""')"
          echo "HEAD merged via PR head-ref: '${head_pr_ref}'"
          case "$head_pr_ref" in release/*) ;; *) echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          ver="$(gh api "repos/${{github.repository }}/contents/control?ref=${{github.sha }}" \
                 --jq .content | base64 -d | awk -F': *' '/^Version:/{gsub(/ /,"",$2); print $2; exit}')"
          if [ -z "$ver" ] || gh api "repos/${{github.repository }}/git/ref/tags/v$ver" >/dev/null 2>&1; then
            echo "no version, or tag v$ver already exists — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true"  >> "$GITHUB_OUTPUT"
            echo "version=$ver"  >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish release + APT
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: NuclearTweaks/.github/.github/actions/setup-theos@main

      - name: Build final deb
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          COPYFILE_DISABLE=1 LDID="$LDID_BIN" make clean package FINALPACKAGE=1
          ls -l packages/

      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN }}
          VER: ${{needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(awk -F': *' '/^Package:/{print $2; exit}' control)"
          tag="v$VER"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "tag $tag exists — assuming $tag already published"; exit 0
          fi
          git config user.name  "NuclearTweaks-CI"
          git config user.email "ci@nucleartweaks.invalid"
          git tag -a "$tag" -m "$pkg $VER"
          git push origin "refs/tags/$tag"
          notes="**$pkg** $VER — rootless device .deb attached. Install via APT: https://$ORG.github.io/"
          gh release create "$tag" packages/*.deb --title "${{github.event.repository.name }} $VER" --notes "$notes"

      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN }}
          BOT_PAT: ${{secrets.NUCLEAR_BOT_TOKEN }}
        run: |
          set -uo pipefail
          tok="${BOT_PAT:-$GH_TOKEN}"
          if gh api -X POST "repos/$ORG/$APT_REPO/dispatches" \
               -H "Authorization: Bearer $tok" \
               -f event_type=tweak-published \
               -f "client_payload[repo]=$GITHUB_REPOSITORY" >/dev/null; then
            echo "dispatched $ORG/$APT_REPO rebuild"
          else
            echo "::warning::APT dispatch failed (is the bot secret set on THIS repo? the APT repo's daily rebuild will still pick this up)"
          fi

  release-pr:
    name: build + open release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: NuclearTweaks/.github/.github/actions/setup-theos@main

      - name: Build rootless device deb (sanity)
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          COPYFILE_DISABLE=1 LDID="$LDID_BIN" make clean package FINALPACKAGE=1
          ls -l packages/

      - uses: actions/upload-artifact@v4
        with:
          name: device-deb-preview
          path: packages/*.deb
          if-no-files-found: error

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin   # publish job may have tagged during this run
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          tag_ver="${latest_tag#v}"
          ctrl_ver="$(awk -F': *' '/^Version:/{gsub(/ /,"",$2); print $2; exit}' control)"
          is_le() { [ "$1" = "$2" ] || [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$2" ]; }
          base="$ctrl_ver"
          if [ -n "$latest_tag" ] && is_le "$ctrl_ver" "$tag_ver"; then base="$tag_ver"; fi
          if [ -n "$latest_tag" ] && is_le "$base" "$tag_ver"; then
            IFS=. read -r M m p <<<"$tag_ver"
            msgs="$(git log "${latest_tag}..HEAD" --format='%s' || true)"
            if printf '%s' "$msgs" | grep -qE '\[major\]|!:'; then M=$((M+1)); m=0; p=0
            elif printf '%s' "$msgs" | grep -qE '\[minor\]'; then m=$((m+1)); p=0
            else p=$((p+1)); fi
            next="$M.$m.$p"
          else
            next="$base"
          fi
          echo "current=$ctrl_ver" >> "$GITHUB_OUTPUT"
          echo "latest=$tag_ver" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "control=$ctrl_ver latest_tag=${tag_ver:-none} next=$next"

      - name: Open/update release PR
        env:
          GH_TOKEN: ${{secrets.NUCLEAR_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          NEXT: ${{steps.version.outputs.next }}
          CUR: ${{steps.version.outputs.current }}
          LATEST: ${{steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          branch="release/v$NEXT"
          git config user.name  "NuclearTweaks-CI"
          git config user.email "ci@nucleartweaks.invalid"
          # close stale release PRs at or below the latest tag (e.g. one opened
          # moments before the publish job created that tag)
          while read -r n ref; do
            v="${ref#release/v}"
            if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$v" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ]; then
              gh pr close "$n" --comment "superseded — v$v shipped/behind latest v$LATEST" || true
            fi
          done < <(gh pr list --state open --json number,headRefName \
                   --jq '.[] | select(.headRefName | startswith("release/")) | "\(.number) \(.headRefName)"')
          git checkout -B "$branch"
          grep -q "^Version: $NEXT$" control || sed -i '' "s/^Version: .*/Version: $NEXT/" control
          if ! grep -q "^## $NEXT" CHANGELOG.md 2>/dev/null; then
            RANGE="${LATEST:+v$LATEST..}HEAD"
            python3 - "$NEXT" "$RANGE" <<'PY'
          import sys, subprocess, pathlib
          ver, rng = sys.argv[1], sys.argv[2]
          msgs = subprocess.run(["git","log","--no-merges","--format=* %s (`%h`)",rng],
                                capture_output=True, text=True).stdout.strip() or f"* release {ver}"
          p = pathlib.Path("CHANGELOG.md"); old = p.read_text() if p.exists() else "# Changelog\n"
          head, _, body = old.partition("\n")
          date = subprocess.run(["date","-u","+%F"],capture_output=True,text=True).stdout.strip()
          entry = f"## {ver} — {date}\n\n{msgs}\n\n"
          body = body.lstrip("\n# Changelog")
          p.write_text(f"{head}\n\n{entry}{body}")
          PY
          fi
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): v$NEXT [ci skip]"
          if [ "$(git rev-list --count "origin/main..$branch")" = "0" ]; then
            git commit --allow-empty -m "chore(release): v$NEXT (release gate) [ci skip]"
          fi
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "open PR for $branch exists — branch refreshed"
          else
            gh pr create --base main --head "$branch" --title "release: v$NEXT" --body-file - <<PR
          ### Automatic release PR — ${{github.event.repository.name }} v$NEXT
          - version: \`$CUR\` → **\`$NEXT\`** (latest tag: \`${LATEST:-none}\`)
          - rootless device deb built + validated on the runner (see workflow run artifacts)
          - **merge to ship**: GitHub Release + deb asset + APT repo update
          - different bump wanted? push a commit mentioning \`[minor]\`/\`[major]\`, or edit \`control\` on this branch
          *Sim check was local; CI covers the real-device deb only.*
          PR
          fi
